name: Dead Code Cleanup

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:     # Manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Fetch instrumentation report
        run: |
          set -e  # Exit on any error
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            http://34.226.45.56:8000/stats/clean > report.json

          # Validate response
          if [ ! -s report.json ]; then
            echo "❌ Failed: empty response from backend"
            exit 1
          fi

          # Check valid JSON
          jq empty report.json || { echo "❌ Invalid JSON"; exit 1; }
          echo "✓ Report fetched ($(wc -c < report.json) bytes)"

      - name: Analyze dead code
        run: |
          chmod +x ./delete-dead-code
          ./delete-dead-code --limit 5 report.json > recommendations.json

      - name: Verify GH_TOKEN
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ GH_TOKEN is NOT set"
            exit 1
          else
            echo "✅ GH_TOKEN is available"
            gh auth status
          fi

      - name: Apply deletions and create PR
        run: |
          python3 - <<'EOF'
          import json
          import subprocess
          import os

          try:
              with open("recommendations.json") as f:
                  recommendations = json.load(f)
          except FileNotFoundError:
              print("❌ Error: recommendations.json not created by skill")
              exit(1)
          except json.JSONDecodeError as e:
              print(f"❌ Error: Invalid JSON in recommendations: {e}")
              exit(1)

          if not recommendations.get("groups"):
              print("✓ No dead code to remove")
              exit(0)

          # Validate schema
          try:
              assert recommendations.get("summary")
              assert recommendations.get("status") == "success"
          except (AssertionError, KeyError) as e:
              print(f"❌ Error: Invalid recommendations schema: {e}")
              exit(1)

          # Configure git
          subprocess.run(["git", "config", "user.name", "github-actions"], check=True)
          subprocess.run(["git", "config", "user.email", "actions@github.com"], check=True)

          # Create branch
          branch_name = "cleanup/dead-code"
          try:
              subprocess.run(["git", "checkout", "-b", branch_name], check=True)
          except subprocess.CalledProcessError:
              subprocess.run(["git", "checkout", branch_name], check=True)

          # Apply deletions
          total_deleted = 0
          for group in recommendations["groups"]:
              file_path = group["file"]
              # Try with demo/ prefix if file not found
              if not os.path.exists(file_path) and os.path.exists(f"demo/{file_path}"):
                  file_path = f"demo/{file_path}"
              if not os.path.exists(file_path):
                  print(f"⚠ File not found: {file_path}")
                  continue

              with open(file_path) as f:
                  lines = f.readlines()

              # Sort deletions in reverse to preserve line numbers
              for deletion in sorted(group["deletions"], key=lambda d: d["start_line"], reverse=True):
                  start = deletion["start_line"] - 1  # Convert to 0-indexed
                  end = deletion["end_line"]  # end_line is inclusive
                  del lines[start:end]
                  total_deleted += (end - start)

              with open(file_path, "w") as f:
                  f.writelines(lines)

              print(f"✓ Deleted {group['total_lines']} lines from {file_path}")

          # Commit changes
          subprocess.run(["git", "add", "-A"], check=True)

          # Check if there are changes to commit
          status_result = subprocess.run(["git", "status", "--porcelain"], capture_output=True, text=True)
          if not status_result.stdout.strip():
              print("⚠ No changes to commit (all files not found?)")
              exit(0)

          subprocess.run([
              "git", "commit", "-m",
              f"Remove {total_deleted} lines of dead code\n\n"
              f"Analysis: {len(recommendations['groups'])} groups identified\n"
              f"Confidence: 95%+ that code is unreachable (frequency=0)\n"
              f"Files modified: {len(recommendations['groups'])}"
          ], check=True)

          # Create PR
          pr_body = f"## Automated Dead Code Removal\n\n"
          pr_body += f"**Analysis Summary:**\n"
          pr_body += f"- Total nodes analyzed: {recommendations['summary']['total_nodes']}\n"
          pr_body += f"- Executed nodes: {recommendations['summary']['executed_nodes']}\n"
          pr_body += f"- Dead nodes (frequency=0): {recommendations['summary']['dead_nodes']}\n"
          pr_body += f"- Files affected: {len(recommendations['groups'])}\n\n"
          pr_body += f"**Removal Groups:**\n\n"
          for i, group in enumerate(recommendations["groups"], 1):
              pr_body += f"### {i}. {group['file']}\n"
              pr_body += f"- Lines: {group['total_lines']}\n"
              pr_body += f"- Confidence: {group['confidence']}%\n"
              pr_body += f"- Risk: {group['risk']}/10\n\n"

          pr_body += "**Safety:**\n"
          pr_body += "- Only removes code with frequency=0 (never executed)\n"
          pr_body += "- All deletions grouped by file\n"
          pr_body += "- Easy to revert if needed\n\n"
          pr_body += "Generated by automated dead code analysis."

          env = os.environ.copy()
          result = subprocess.run([
              "gh", "pr", "create",
              "--title", "Remove dead code identified by RuntimeSpy",
              "--body", pr_body
          ], capture_output=True, text=True, env=env)

          if result.returncode == 0:
              print(f"✓ PR created: {result.stdout}")
          else:
              print(f"❌ PR creation failed: {result.stderr}")
              exit(1)
          EOF

      - name: Push branch
        run: |
          if git rev-parse --verify cleanup/dead-code >/dev/null 2>&1; then
            git push --force-with-lease origin cleanup/dead-code
            echo "✓ Branch pushed"
          else
            echo "✓ No branch to push (no dead code found)"
          fi
