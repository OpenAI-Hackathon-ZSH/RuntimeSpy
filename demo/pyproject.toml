[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runtimespy-commerce-demo"
version = "0.1.0"
description = "Branch-rich Flask commerce API for demonstrating RuntimeSpy"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "flask-swagger-ui>=5.32.8,<6",
  "runtimespy",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
runtimespy = { path = "..", editable = true }
